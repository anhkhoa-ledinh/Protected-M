# Central server + daily backup. Run from the repo root:
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build
name: hcpd

x-hardened: &hardened
  image: hcpd-server
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  server:
    <<: *hardened
    container_name: ${HCPD_CONTAINER:-hcpd-server}
    mem_limit: ${HCPD_MEM_LIMIT:-256m}
    pids_limit: 128
    environment:
      HCPD_PORT: "47830"
      HCPD_MAX_CONNS: ${HCPD_MAX_CONNS:-200}
      HCPD_MAX_CONNS_PER_IP: ${HCPD_MAX_CONNS_PER_IP:-10}
      HCPD_RATE_PER_S: ${HCPD_RATE_PER_S:-20}
      HCPD_RATE_BURST: ${HCPD_RATE_BURST:-40}
      HCPD_CONNECTS_PER_MIN: ${HCPD_CONNECTS_PER_MIN:-60}
    ports:
      - "${HCPD_BIND:-127.0.0.1}:${HCPD_PORT:-47830}:47830"
    volumes:
      - data:/data
      - certs:/certs:ro

  backup:
    <<: *hardened
    container_name: ${HCPD_BACKUP_CONTAINER:-hcpd-backup}
    mem_limit: 128m
    pids_limit: 32
    entrypoint: ["python", "-m", "src.server.backup"]
    command: ["run", "--data-dir", "/data", "--backup-dir", "/backups",
              "--keep", "${HCPD_BACKUP_KEEP:-7}", "--every", "${HCPD_BACKUP_EVERY_S:-86400}"]
    healthcheck:
      disable: true
    depends_on:
      server:
        condition: service_healthy   # the database exists once the server is up
    volumes:
      - data:/data
      - backups:/backups

volumes:
  data:
    name: ${HCPD_DATA_VOLUME:-hcpd-data}
  certs:
    name: ${HCPD_CERTS_VOLUME:-hcpd-certs}
  backups:
    name: ${HCPD_BACKUPS_VOLUME:-hcpd-backups}
