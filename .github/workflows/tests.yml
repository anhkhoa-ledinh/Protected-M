name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # The app runs on Windows and Linux (run_game.bat / run_game.sh).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: "1"
      # CI must never download models (Depth Anything / LaMa weights are
      # not committed to git) — tests/conftest.py's model_files fixture
      # skips anything that needs them instead of fetching them here.
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_account_art.py reads an older commit with `git show`;
          # the default shallow clone (depth 1) does not contain it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Libraries the imports need on a headless Ubuntu; GL tests skip there.
      - name: system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      # CPU wheels of the locked version: the default Linux wheel pulls
      # several GB of CUDA libraries the tests never use.
      - name: torch (Linux, CPU wheels)
        if: runner.os == 'Linux'
        run: |
          TV=$(grep -E '^torch==' requirements-lock.txt | cut -d= -f3)
          VV=$(grep -E '^torchvision==' requirements-lock.txt | cut -d= -f3)
          pip install "torch==$TV" "torchvision==$VV" --index-url https://download.pytorch.org/whl/cpu

      # Pinned, not requirements.txt's unpinned >= — those resolve to
      # whatever is newest on PyPI at install time, which is not necessarily
      # what the local passing test suite ran against. requirements-lock.txt
      # is `pip freeze` from the dev venv the suite is verified green on.
      - run: pip install -r requirements-lock.txt

      - run: python -m pytest -q -ra
