name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    env:
      # The app is Windows-only (.bat launchers, winsound, ctypes.windll),
      # so a Linux runner would test the wrong platform.
      HF_HUB_OFFLINE: "1"
      # CI must never download models (Depth Anything / LaMa weights are
      # not committed to git) — tests/conftest.py's model_files fixture
      # skips anything that needs them instead of fetching them here.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q -ra
